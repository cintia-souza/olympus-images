<html>
<head>
  <style>
    body { margin: 0; padding: 0; background-color: #000000; font-family: 'Segoe UI', Arial, sans-serif; }
    .container { max-width: 500px; margin: 0 auto; padding: 40px 20px; }
    .card { background-color: #0a0a0f; border: 1px solid #1e293b; border-radius: 12px; padding: 40px 30px; text-align: center; }
    .logo { font-size: 24px; font-weight: bold; color: #ffffff; margin-bottom: 8px; }
    .logo span { color: #0ea5e9; }
    .subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
    h2 { color: #ffffff; font-size: 20px; margin-bottom: 12px; }
    p { color: #94a3b8; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
    .btn { display: inline-block; background-color: #0ea5e9; color: #000000; font-weight: 600; text-decoration: none; padding: 12px 32px; border-radius: 8px; font-size: 14px; }
    .footer { color: #475569; font-size: 12px; margin-top: 30px; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="logo"><span>Byte Quest</span> AI</div>
      <div class="subtitle">Gerador de Imagens com IA</div>

      <h2>Seu link de acesso 🚀</h2>
      <p>Clique no botão abaixo para acessar sua conta na Byte Quest AI.</p>

      <a href="{{ .ConfirmationURL }}" class="btn">Acessar Conta</a>

      <p style="margin-top: 24px; font-size: 12px; color: #475569;">Este link expira em 1 hora. Se você não solicitou este acesso, ignore este email.</p>
    </div>
    <div class="footer">
      © 2025 Byte Quest AI — Cintia Byte Quest
    </div>
  </div>
</body>
</html>
